<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f2f31" />
  <title>Rafi Busthami</title>
  <meta name="description" content="Rafi Busthami — Information Technology student at Universitas Gadjah Mada." />

  <meta property="og:title" content="Rafi Busthami" />
  <meta property="og:description" content="Information Technology · Universitas Gadjah Mada" />
  <meta property="og:image" content="preview.jpg" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #2f2f31;
      --text: #f5ece8;
      --soft: rgba(245, 236, 232, .65);
      --hair: rgba(245, 236, 232, .22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;
      letter-spacing: .01em;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: var(--text); color: var(--bg); }
    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
    }

    /* top bar */
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hair);
    }
    .status { margin-left: auto; padding: 8px 0; color: #6fd394; }
    .bar { justify-content: space-between; align-items: flex-start; }
    .bar .left { display: flex; flex-direction: column; gap: 2px; }
    .bar .right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 2px; }
    .bar .soft { color: var(--soft);  }

    /* main */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      padding: 72px 0;
    }
    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(30px, 5.5vw, 56px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .role {
      margin-top: 18px;
      font-size: clamp(17px, 2.2vw, 20px);
      
      color: var(--soft);
    }
    .role a { color: var(--text); border-bottom: 1px solid var(--hair); }
    .role a:hover { border-color: var(--text); }

    /* links */
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px 24px;
      flex-wrap: wrap;
      padding-top: 18px;
      border-top: 1px solid var(--hair);
    }
    .links { display: flex; gap: 28px; flex-wrap: wrap; }
    .links a {
      font-size: 17px;
      padding: 8px 0;
      display: inline-block;
      transition: opacity .15s;
    }
    .links a:hover span { transform: translate(3px, -3px); }
    .links a:active { opacity: .5; }
    .email {
      text-transform: none;
      letter-spacing: .04em;
    }
    /* single underline on clickable text */
    .links a, .role a, .email {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
      border-bottom: 0;
    }
    .links a:hover, .role a:hover, .email:hover { opacity: .7; }

    @media (max-width: 600px) {
      .page { padding: 20px 20px; }
      .bar { font-size: 13px; }
      .hero { padding: 56px 0; }
      .links { gap: 22px; }
      .links a { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">

    <div class="bar">
      <span class="left soft">
        <span>Yogyakarta, Indonesia</span>
      </span>
      <span class="right">
        <span>Universitas Gadjah Mada</span>
        <span class="soft">Exchange @ UTP, Malaysia 2026</span>
        <span class="soft">Ex Cyber Security Engineer Intern @INA17</span>
      </span>
    </div>

    <section class="hero">
      <h1>Rafi Busthami</h1>
      <p class="role">IT <a href="https://ugm.ac.id" target="_blank" rel="noopener">@UGM</a></p>
    </section>

    <div class="foot">
      <nav class="links">
        <a href="https://www.linkedin.com/in/rafi-busthami-5985832aa" target="_blank" rel="noopener">LinkedIn</a>
        <a href="cv.pdf" target="_blank">Resume</a>
        <a class="email" href="mailto:busthami.rafi@gmail.com">busthami.rafi@gmail.com</a>
      </nav>
      <span class="status">Open to internships</span>
    </div>

  </main>
</body>
</html>
